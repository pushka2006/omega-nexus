name: Deploy Static Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build Static Demo Bundle
        working-directory: ./frontend
        env:
          PUBLIC_URL: /omega-nexus
          REACT_APP_BACKEND_URL: https://omega-nexus-backend.onrender.com
          CI: false
        run: npm run build

      - name: Prepare SPA Routing & Disable Jekyll
        working-directory: ./frontend/build
        run: |
          cp index.html 404.html
          touch .nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/build
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
