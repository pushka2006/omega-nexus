version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: nexus-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: nexus_secret
      MONGO_INITDB_DATABASE: nexus_os
    volumes:
      - mongodb_data:/data/db
    networks:
      - nexus-net

  postgresql:
    image: postgres:16-alpine
    container_name: nexus-postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secret
      POSTGRES_DB: nexus_business
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./infrastructure/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nexus-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: nexus-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - nexus-net

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - nexus-net

  minio:
    image: minio/minio:latest
    container_name: nexus-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: nexus_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - nexus-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://nexus:nexus_secret@mongodb:27017/nexus_os?authSource=admin
      POSTGRES_URI: postgresql://nexus:nexus_secret@postgresql:5432/nexus_business
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: nexus
      MINIO_SECRET_KEY: nexus_secret
      MINIO_BUCKET: nexus-storage
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-nexus-dev-secret-change-in-production}
    depends_on:
      - mongodb
      - postgresql
      - chromadb
      - redis
      - minio
    volumes:
      - ./backend:/app
    networks:
      - nexus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - nexus-net

volumes:
  mongodb_data:
  postgresql_data:
  chromadb_data:
  redis_data:
  minio_data:

networks:
  nexus-net:
    driver: bridge
